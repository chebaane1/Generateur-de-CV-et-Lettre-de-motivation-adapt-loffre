name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript (app + prompts)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  pdf-service:
    name: Python (PDF service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pdf/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile and import every module
        run: |
          python -m compileall -q app
          python -c "import app.main"

  docker:
    name: Docker build + smoke test
    needs: [typecheck, pdf-service]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts
        run: bash -n bots.sh tests/smoke.sh
      - name: Build images
        run: docker compose build app pdf
      - name: Start app + pdf
        run: |
          mkdir -p data
          cp prompts/profile.example.md prompts/profile.md
          docker compose up -d app pdf
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Smoke test (sample CV + letter, no AI call)
        run: tests/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs app pdf
      - name: Stop
        if: always()
        run: docker compose down
