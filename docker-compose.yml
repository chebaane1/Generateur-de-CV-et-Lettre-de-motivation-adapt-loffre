services:
  xelatex-api:
    build: .
    container_name: xelatex-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
  #################################################
  claude-bridge:
    build: ./claude-bridge
    restart: unless-stopped
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN}
      - CLAUDE_MODEL=sonnet
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
    ports:
      - "127.0.0.1:8080:8080"   # web page at http://localhost:8080 (this PC only)
    volumes:
      - ./prompts:/prompts:ro   # shared prompts + profile, edits apply on the next offer
      - ./web:/web              # web page; bots.sh writes engines.json here

  # Local open-source model (no account, no API key). Pulls OLLAMA_MODEL on first start.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=15m
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 3 && ollama pull $${OLLAMA_MODEL} && wait"]
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
