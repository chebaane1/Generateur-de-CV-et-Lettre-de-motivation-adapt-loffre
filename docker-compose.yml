services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
    volumes:
      - n8n_data:/home/node/.n8n

  xelatex-api:
    build: .
    container_name: xelatex-api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env

volumes:
  n8n_data:
    external: true
